# ============================================================
# MetaFit — Orquestación de Servicios
# Archivo: /docker-compose.yml  (raíz del proyecto)
# Uso:     docker compose up --build
#
# BD: imagen mariadb:11 (motor de producción). Docker ejecuta todos
#      los .sql de ./database/ dentro de /docker-entrypoint-initdb.d/
#      en orden LEXICOGRÁFICO, que coincide con las DEPENDENCIAS:
#        01_estructura.sql         -> tablas base
#        02_migracion_movil.sql    -> tablas app móvil   (depende de 01)
#        03_mejoras_estructura.sql -> columnas + tablas  (depende de 01 y 02)
#        04_datos_iniciales.sql    -> TODOS los datos    (depende de 01, 02 y 03)
#        05_password_reset.sql     -> tabla recuperación (depende de 01)
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # SERVICIO 1: Base de Datos MariaDB 11
  # ──────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: metafit_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      # Forzar utf8mb4 desde arranque para evitar problemas de encoding
      MYSQL_INITDB_SKIP_TZINFO: "true"
    ports:
      - "3306:3306"
    volumes:
      # Se monta la CARPETA completa. Docker ejecuta TODOS los .sql en
      # orden lexicográfico, que ya coincide con las dependencias:
      #   01_estructura -> 02_migracion_movil -> 03_mejoras_estructura
      #   -> 04_datos_iniciales -> 05_password_reset
      # Los scripts solo se ejecutan si el volumen de datos está vacío
      # (primer arranque). Para re-ejecutarlos: docker compose down -v
      - ./database:/docker-entrypoint-initdb.d:ro
      # Persistencia de datos entre reinicios
      - metafit_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - metafit_net

  # ──────────────────────────────────────────────────────────
  # SERVICIO 2: Backend Node.js
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metafit_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DB_HOST: db # <- nombre del servicio Docker, NO localhost
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy # espera a que MySQL esté listo y responda ping
    networks:
      - metafit_net

  # ──────────────────────────────────────────────────────────
  # SERVICIO 3: Frontend React/Vite
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend_web
      dockerfile: Dockerfile
    container_name: metafit_frontend
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      # URL pública del backend accesible desde el navegador del host
      - VITE_API_URL=http://localhost:${PORT}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - metafit_net

  # ──────────────────────────────────────────────────────────
  # SERVICIO 4: phpMyAdmin
  # Interfaz web para auditar visualmente la base de datos MySQL
  # Acceso: http://localhost:8080
  # Usuario: root  |  Contraseña: valor de DB_PASSWORD en .env
  # ──────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: metafit_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db # <- nombre exacto del servicio MySQL en esta red
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80" # phpMyAdmin escucha en el 80 interno; lo exponemos en el 8080 local
    depends_on:
      db:
        condition: service_healthy # arranca solo cuando MySQL ya responde el healthcheck
    networks:
      - metafit_net

  # ──────────────────────────────────────────────────────────
  # SERVICIO 5: n8n — Automatización y workflows
  # Acceso: http://localhost:5678
  # Usuario: admin  |  Contraseña: Admin123!
  # ──────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n
    container_name: metafit_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=Admin123!
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - metafit_net

# ──────────────────────────────────────────────────────────
# VOLUMES y NETWORKS
# ──────────────────────────────────────────────────────────
volumes:
  metafit_db_data:
    # Para borrar el volumen y re-inicializar la DB desde cero:
    # docker compose down -v && docker compose up --build
  n8n_data:

networks:
  metafit_net:
    driver: bridge

