sonar.projectKey=metafit
sonar.projectName=MetaFit
sonar.sourceEncoding=UTF-8
sonar.sources=backend, frontend_web/src, movil/src
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/coverage/**, **/__tests__/**, **/*.test.js, **/*.test.jsx, **/*.spec.js, **/*.spec.jsx, **/*.json, **/android/**, **/ios/**
sonar.coverage.exclusions=**/__tests__/**, **/*.test.js, **/*.test.jsx, **/*.spec.js, **/*.spec.jsx
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend_web/coverage/lcov.info,movil/coverage/lcov.info
