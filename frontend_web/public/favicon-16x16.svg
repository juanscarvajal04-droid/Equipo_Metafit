<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e31c25"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e31c25"/>
    </linearGradient>
  </defs>
  <!-- Hexagonal shell -->
  <path d="M8 1 L14.5 4 L15.5 8 L14.5 12 L8 15 L1.5 12 L0.5 8 L1.5 4 Z" fill="#0a0a0f" stroke="url(#g1)" stroke-width="0.5"/>
  <!-- Dumbbell bar -->
  <rect x="4" y="7" width="8" height="2" rx="0.8" fill="url(#g3)"/>
  <!-- Left weight -->
  <rect x="3" y="5.5" width="2.5" height="5" rx="0.8" fill="url(#g1)"/>
  <!-- Right weight -->
  <rect x="10.5" y="5.5" width="2.5" height="5" rx="0.8" fill="url(#g2)"/>
  <!-- MF text -->
  <text x="8" y="8.5" text-anchor="middle" dominant-baseline="central"
        font-family="sans-serif" font-weight="900" font-size="3.5" fill="#fff">MF</text>
  <!-- Motion arcs -->
  <path d="M2 5 Q1 8 2 11" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>
  <path d="M14 5 Q15 8 14 11" fill="none" stroke="#e31c25" stroke-width="0.5" opacity="0.4"/>
</svg>
