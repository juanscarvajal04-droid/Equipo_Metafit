<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="purpleDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e31c25"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e31c25"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e31c25" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Hexagonal outer shell -->
  <path d="M32 2 L58 11 L62 32 L58 53 L32 62 L6 53 L2 32 L6 11 Z"
        fill="url(#bgGrad)" stroke="url(#purpleGrad)" stroke-width="1.5"
        stroke-linejoin="round" filter="url(#outerGlow)"/>

  <!-- Inner glow fill -->
  <path d="M32 2 L58 11 L62 32 L58 53 L32 62 L6 53 L2 32 L6 11 Z"
        fill="url(#glowGrad)" stroke="none"/>

  <!-- Decorative inner hexagon ring -->
  <path d="M32 6 L54 14 L58 32 L54 50 L32 58 L10 50 L6 32 L10 14 Z"
        fill="none" stroke="url(#purpleGrad)" stroke-width="0.5" opacity="0.25"
        stroke-linejoin="round"/>

  <!-- Vertex accent dots (6 points of the hexagon → training cycle) -->
  <circle cx="32" cy="2" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="58" cy="11" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="62" cy="32" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="58" cy="53" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="32" cy="62" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="6" cy="53" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="2" cy="32" r="1.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="6" cy="11" r="1.5" fill="#8b5cf6" opacity="0.8"/>

  <!-- Central dumbbell -->
  <!-- Main bar -->
  <rect x="17" y="28.5" width="30" height="7" rx="3" fill="url(#barGrad)" filter="url(#innerShadow)"/>

  <!-- Bar highlight line -->
  <rect x="19" y="29.5" width="26" height="1.5" rx="0.75" fill="#ffffff" opacity="0.15"/>

  <!-- Left weight plate (purple) – outer -->
  <rect x="13" y="22" width="10" height="20" rx="3.5" fill="url(#purpleGrad)" filter="url(#innerShadow)"/>
  <!-- Left weight inner highlight -->
  <rect x="15" y="24" width="6" height="16" rx="2" fill="url(#purpleDark)" opacity="0.4"/>

  <!-- "M" negative-space cutout on left weight -->
  <!-- Left leg of M -->
  <line x1="16.5" y1="25" x2="16.5" y2="39" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Center V of M -->
  <line x1="16.5" y1="31" x2="18" y2="34" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="18" y1="34" x2="19.5" y2="31" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Right leg of M -->
  <line x1="19.5" y1="25" x2="19.5" y2="39" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Right weight plate (red) – outer -->
  <rect x="41" y="22" width="10" height="20" rx="3.5" fill="url(#redGrad)" filter="url(#innerShadow)"/>
  <!-- Right weight inner highlight -->
  <rect x="43" y="24" width="6" height="16" rx="2" fill="#8b0000" opacity="0.3"/>

  <!-- "F" negative-space cutout on right weight -->
  <!-- Stem of F -->
  <line x1="43.5" y1="25" x2="43.5" y2="39" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Top bar of F -->
  <line x1="43.5" y1="26" x2="48.5" y2="26" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Middle bar of F -->
  <line x1="43.5" y1="31" x2="47" y2="31" stroke="#0a0a0f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Weight plate side grooves -->
  <line x1="13.5" y1="24" x2="13.5" y2="40" stroke="#000" stroke-width="0.8" opacity="0.2"/>
  <line x1="22.5" y1="24" x2="22.5" y2="40" stroke="#000" stroke-width="0.8" opacity="0.2"/>
  <line x1="41.5" y1="24" x2="41.5" y2="40" stroke="#000" stroke-width="0.8" opacity="0.2"/>
  <line x1="50.5" y1="24" x2="50.5" y2="40" stroke="#000" stroke-width="0.8" opacity="0.2"/>

  <!-- Center "MF" monogram on the bar -->
  <text x="32" y="32.8" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="900" font-size="7.5" fill="#ffffff"
        letter-spacing="0.3">MF</text>

  <!-- Motion/energy arcs -->
  <!-- Left motion arc -->
  <path d="M7 18 Q3 32 7 46" fill="none" stroke="#a78bfa" stroke-width="1.2"
        opacity="0.4" stroke-linecap="round"/>
  <!-- Right motion arc -->
  <path d="M57 18 Q61 32 57 46" fill="none" stroke="#e31c25" stroke-width="1.2"
        opacity="0.4" stroke-linecap="round"/>

  <!-- Small energy particles -->
  <circle cx="5" cy="14" r="1" fill="#c084fc" opacity="0.6"/>
  <circle cx="59" cy="14" r="1" fill="#f87171" opacity="0.6"/>
  <circle cx="5" cy="50" r="0.8" fill="#c084fc" opacity="0.4"/>
  <circle cx="59" cy="50" r="0.8" fill="#f87171" opacity="0.4"/>
  <circle cx="32" cy="1" r="0.8" fill="#c084fc" opacity="0.3"/>
  <circle cx="32" cy="63" r="0.8" fill="#c084fc" opacity="0.3"/>
</svg>
