  <!-- Dumbbell bar -->
  <rect x="8.5" y="14" width="15" height="4" rx="1.5" fill="url(#g3)"/>
  <!-- Left weight -->
  <rect x="6.5" y="11" width="5.5" height="10" rx="1.8" fill="url(#g1)"/>
  <!-- Right weight -->
  <rect x="20" y="11" width="5.5" height="10" rx="1.8" fill="url(#g2)"/>
  <!-- MF text -->
  <text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, sans-serif" font-weight="900" font-size="5" fill="#fff"
        letter-spacing="0.2">MF</text>
  <!-- Motion arcs -->
  <path d="M3.5 9 Q2 16 3.5 23" fill="none" stroke="#a78bfa" stroke-width="0.6" opacity="0.5"/>
  <path d="M28.5 9 Q30 16 28.5 23" fill="none" stroke="#e31c25" stroke-width="0.6" opacity="0.5"/>
  <!-- Vertex dots -->
  <circle cx="16" cy="1" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="29" cy="6" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="31" cy="16" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="29" cy="26" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="16" cy="31" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="3" cy="26" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="1" cy="16" r="0.6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="3" cy="6" r="0.6" fill="#8b5cf6" opacity="0.6"/>
