<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121e"/>
      <stop offset="50%" stop-color="#0e0e16"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gPurpleDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gPurpleLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="30%" stop-color="#e31c25"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="gRedDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="65%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e31c25"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e31c25" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="fGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="fInnerGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
    <pattern id="pGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0L8 8M0 8L8 8" stroke="rgba(139,92,246,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background rounded rect (Apple style) -->
  <rect x="6" y="6" width="168" height="168" rx="36" fill="url(#gBg)" stroke="url(#gPurple)" stroke-width="2.5" opacity="0.9"/>
  <rect x="6" y="6" width="168" height="168" rx="36" fill="url(#pGrid)"/>
  <rect x="6" y="6" width="168" height="168" rx="36" fill="url(#gGlow)"/>
  <rect x="6" y="6" width="168" height="168" rx="36" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>

  <!-- Decorative inner rect -->
  <rect x="18" y="18" width="144" height="144" rx="26" fill="none" stroke="url(#gPurple)" stroke-width="0.8" opacity="0.2"/>
  <rect x="22" y="22" width="136" height="136" rx="22" fill="none" stroke="url(#gRed)" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 6"/>

  <!-- Corner accent dots -->
  <circle cx="28" cy="28" r="3" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="152" cy="28" r="3" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="28" cy="152" r="3" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="152" cy="152" r="3" fill="#8b5cf6" opacity="0.4"/>

  <!-- Central circular emblem -->
  <circle cx="90" cy="82" r="52" fill="none" stroke="url(#gPurple)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="90" cy="82" r="49" fill="none" stroke="url(#gMetal)" stroke-width="0.5"/>
  <circle cx="90" cy="82" r="47" fill="none" stroke="url(#gPurple)" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.3"/>
  <circle cx="90" cy="82" r="44" fill="none" stroke="url(#gRed)" stroke-width="0.6" opacity="0.15"/>
  <circle cx="90" cy="82" r="41" fill="none" stroke="url(#gPurple)" stroke-width="0.8" opacity="0.15"/>

  <!-- Hexagonal frame -->
  <path d="M90 35 L131 56 L138 82 L131 108 L90 129 L49 108 L42 82 L49 56 Z"
        fill="none" stroke="url(#gPurple)" stroke-width="1.2" opacity="0.4"
        stroke-linejoin="round" filter="url(#fGlow)"/>
  <path d="M90 44 L124 61 L129 82 L124 103 L90 120 L56 103 L51 82 L56 61 Z"
        fill="none" stroke="url(#gPurpleLight)" stroke-width="0.6" opacity="0.2"
        stroke-linejoin="round"/>

  <!-- Hexagon vertex dots -->
  <circle cx="90" cy="35" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="131" cy="56" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="138" cy="82" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="131" cy="108" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="90" cy="129" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="49" cy="108" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="42" cy="82" r="1.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="49" cy="56" r="1.8" fill="#a78bfa" opacity="0.5"/>

  <!-- Diamond accents -->
  <g fill="#8b5cf6" opacity="0.25">
    <polygon points="90,48 94,52 90,56 86,52"/>
    <polygon points="124,82 120,86 116,82 120,78"/>
    <polygon points="90,116 94,112 90,108 86,112"/>
    <polygon points="56,82 60,86 64,82 60,78"/>
  </g>

  <!-- Central dumbbell -->
  <!-- Bar -->
  <rect x="43" y="74" width="94" height="16" rx="7" fill="url(#gBar)" filter="url(#fShadow)"/>
  <rect x="48" y="76" width="84" height="4" rx="2" fill="#fff" opacity="0.1"/>
  <rect x="48" y="85" width="84" height="1" rx="0.5" fill="#000" opacity="0.12"/>

  <!-- Left weight -->
  <rect x="30" y="54" width="30" height="56" rx="9" fill="url(#gPurple)" filter="url(#fShadow)"/>
  <rect x="34" y="58" width="22" height="48" rx="6" fill="url(#gPurpleDark)" opacity="0.3"/>
  <rect x="30" y="54" width="30" height="56" rx="9" fill="url(#gMetal)" opacity="0.2"/>
  <rect x="30" y="54" width="30" height="56" rx="9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- M cutout -->
  <line x1="38" y1="63" x2="38" y2="101" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="38" y1="79" x2="45" y2="87" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="45" y1="87" x2="52" y2="79" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="52" y1="63" x2="52" y2="101" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Right weight -->
  <rect x="120" y="54" width="30" height="56" rx="9" fill="url(#gRed)" filter="url(#fShadow)"/>
  <rect x="124" y="58" width="22" height="48" rx="6" fill="url(#gRedDark)" opacity="0.25"/>
  <rect x="120" y="54" width="30" height="56" rx="9" fill="url(#gMetal)" opacity="0.2"/>
  <rect x="120" y="54" width="30" height="56" rx="9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- F cutout -->
  <line x1="128" y1="63" x2="128" y2="101" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="128" y1="65" x2="146" y2="65" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="128" y1="80" x2="142" y2="80" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Side grooves -->
  <line x1="32" y1="62" x2="32" y2="102" stroke="#000" stroke-width="1.5" opacity="0.1"/>
  <line x1="58" y1="62" x2="58" y2="102" stroke="#000" stroke-width="1.5" opacity="0.1"/>
  <line x1="122" y1="62" x2="122" y2="102" stroke="#000" stroke-width="1.5" opacity="0.1"/>
  <line x1="148" y1="62" x2="148" y2="102" stroke="#000" stroke-width="1.5" opacity="0.1"/>

  <!-- MF monogram -->
  <text x="90" y="82" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-weight="900" font-size="22" fill="#ffffff"
        letter-spacing="0.5" filter="url(#fInnerGlow)">MF</text>
  <text x="91" y="83" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-weight="900" font-size="22" fill="#000" opacity="0.12"
        letter-spacing="0.5">MF</text>

  <!-- Motion arcs -->
  <path d="M14 48 Q8 82 14 116" fill="none" stroke="url(#gPurple)" stroke-width="2.5"
        opacity="0.3" stroke-linecap="round" filter="url(#fGlow)"/>
  <path d="M166 48 Q172 82 166 116" fill="none" stroke="url(#gRed)" stroke-width="2.5"
        opacity="0.3" stroke-linecap="round" filter="url(#fGlow)"/>

  <!-- Energy particles -->
  <circle cx="12" cy="38" r="3" fill="#c084fc" opacity="0.5"/>
  <circle cx="168" cy="38" r="3" fill="#f87171" opacity="0.5"/>
  <circle cx="12" cy="126" r="2.5" fill="#c084fc" opacity="0.3"/>
  <circle cx="168" cy="126" r="2.5" fill="#f87171" opacity="0.3"/>
  <circle cx="20" cy="30" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="160" cy="30" r="2" fill="#ff6b6b" opacity="0.4"/>

  <!-- METAFIT text at bottom -->
  <text x="90" y="152" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-weight="700" font-size="11" fill="#a78bfa" opacity="0.6"
        letter-spacing="5">METAFIT</text>
</svg>
